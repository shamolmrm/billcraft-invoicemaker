name: billcraft
description: Professional Invoice Maker — BillCraft
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # Auth
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2

  # Image
  screenshot: ^2.1.0
  image_picker: ^1.0.7

  # UI & Design
  iconsax: ^0.0.8
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  fl_chart: ^0.65.0
  smooth_page_indicator: ^1.1.0
  syncfusion_flutter_signaturepad: ^24.2.8

  # Localization
  easy_localization: ^3.0.7

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  connectivity_plus: ^7.0.0
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.0.0
  open_filex: ^4.3.4
  currency_picker: ^2.0.15
  country_picker: ^2.0.26
  auto_size_text: ^3.0.0
  badges: ^3.1.2
  step_progress_indicator: ^1.0.2
  dropdown_search: ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/templates/
    - assets/translations/
